[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wanxiang3d-agent-kit"
version = "3.10.0"
description = "Offline modular Lowpoly foundation studio with semantic parameters and shared geometry"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2", "trimesh>=4.7,<5", "scikit-image>=0.24,<1", "Pillow>=11,<13", "shapely>=2.1,<3", "PyYAML>=6,<7", "jsonschema>=4.20,<5", "numba>=0.61,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "playwright>=1.45"]
build = ["build>=1,<2"]

[project.scripts]
wx = "wanxiang.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wanxiang = ["_resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
